name: Auto Comment on New Issues

on:
  issues:
    types: [opened]

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    # filter to only respond on my created issues
    # TODO: remove filter when testing is over
    if: github.event.issue.user.login == 'Richard-channable'

    permissions:
      issues: write

    steps:
      - name: Wait for it
        run: sleep 1m # TODO: change to 5min when testing is over

      # Required so the action can access your Python script in the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # cache: 'pip'

      # Install required dependencies (Pydantic)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic spacy click
          python -m spacy download en_core_web_sm

      # Run your Python script
      - name: Generate comment content
        id: python-step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/issue_advisor_generator.py

      # Only posts if the python script returned text (output is not empty)
      - name: Comment on new issue
        if: steps.python-step.outputs.comment_body != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${{ steps.python-step.outputs.comment_body }}`
            })